<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090a0c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Training | Log</title><style>
:root{color-scheme:dark;--bg:#090a0c;--panel:#14161a;--line:#30333b;--muted:#a8aeb9;--blue:#327dff;--white:#f6f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:540px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:13px;font-weight:800;letter-spacing:2px;color:#77aaff}.brand b{color:white}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}h2{font-size:21px;margin:0 0 12px}p{color:var(--muted);line-height:1.45;margin:8px 0 16px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:15px 16px;font-weight:700;color:white;background:#22252b;min-height:48px}button:focus-visible,input:focus-visible{outline:2px solid #78aaff;outline-offset:2px}button.primary{background:#2164de}button.full{width:100%;margin-top:12px}button:disabled{opacity:.45;cursor:default}.tabs{display:flex;background:#17191d;padding:4px;border-radius:12px;gap:4px;margin-bottom:22px}.tabs button{flex:1;background:transparent;padding:10px}.tabs button[aria-selected=true]{background:#30343c}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:12px}.muted,small{color:var(--muted);font-size:13px}.progress{height:7px;background:#24272d;border-radius:8px;overflow:hidden;margin:12px 0 20px}.progress div{height:100%;background:var(--blue);border-radius:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.sets{display:grid;grid-template-columns:32px minmax(62px,1fr) minmax(62px,1fr) minmax(76px,1fr);gap:8px;align-items:center;margin:13px 0}.sets .label{font-size:12px;color:var(--muted);text-align:center}.sets input{width:100%;min-width:0;height:53px;border:1px solid #3c414b;background:#090a0c;border-radius:9px;text-align:center;font-size:20px;color:white;padding:4px}.sets input.invalid{border-color:#fa9a9a}.prev{text-align:center;font-size:13px;line-height:1.35;color:#94baff;overflow-wrap:anywhere}.prev strong{display:block;font-size:16px;color:#b6d0ff}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.jump{display:flex;gap:6px;margin:10px 0 18px;flex-wrap:wrap}.jump button{flex:1;padding:7px 0;min-height:40px;border-radius:8px;min-width:32px}.jump button.active{background:#2164de}.jump button.done:not(.active){color:#86b4ff;background:#1b304e}.history{width:100%;text-align:left;margin-bottom:8px}.exercise{border-top:1px solid var(--line);padding:13px 0}.exercise:first-child{border:0}.danger{color:#ffb0b0;background:transparent}.notice{padding:12px;border-radius:10px;background:#2e2223;color:#ffd1d1;font-size:14px;margin-bottom:12px}.save{font-size:12px;color:#a8aeb9}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{flex:1;font-size:14px}.date{color:#91b9ff;font-size:13px;font-weight:700}#toast{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#263a5a;color:white;padding:12px 18px;border-radius:12px;max-width:90%;z-index:10;font-size:14px;box-shadow:0 8px 30px #0008}#toast:empty{display:none}.visually-hidden{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden} @media(max-width:350px){main{padding-left:10px;padding-right:10px}.panel{padding:12px}.sets{gap:5px;grid-template-columns:25px 1fr 1fr 1fr}}
</style></head><body><main><header><div class="brand"><b>TRAINING</b> / LOG</div><span class="save" id="saveStatus" role="status"></span></header><nav class="tabs" aria-label="Ansicht"><button id="tabTrain" aria-selected="true">Training</button><button id="tabHistory" aria-selected="false">Archiv</button></nav><div id="warning" hidden class="notice" role="alert"></div><section id="content"></section><input type="file" id="import" accept="application/json,.json" hidden></main><div id="toast" role="status"></div><script>
'use strict';
const names=['Adduktoren','Latzug','Brustpresse','Abduktoren','Rückenstrecker','Klimmzüge (Hilfe)','Kurzhantel-Armfolge','Schulterpresse'];
const KEY='training-log-v1';const $=s=>document.querySelector(s);let view='train',detail=null,storageOK=true,toastTimer;const empty=()=>names.map(()=>Array.from({length:3},()=>({kg:'',reps:''})));const initial=()=>({version:1,draft:null,history:[]});let data=initial();
function validSet(s){return s&&typeof s.kg==='string'&&typeof s.reps==='string'&&s.kg.length<=20&&s.reps.length<=20;}
function validSession(s){return s&&typeof s.id==='string'&&typeof s.date==='string'&&Number.isFinite(Date.parse(s.date))&&Array.isArray(s.sets)&&s.sets.length===8&&s.sets.every(e=>Array.isArray(e)&&e.length===3&&e.every(validSet));}
function validData(d){return d&&d.version===1&&Array.isArray(d.history)&&d.history.every(validSession)&&(!d.draft||(validSession(d.draft)&&Number.isInteger(d.draft.index)&&d.draft.index>=0&&d.draft.index<8));}
function warn(t){$('#warning').textContent=t;$('#warning').hidden=!t;}
try{const old=localStorage.getItem(KEY);if(old){const parsed=JSON.parse(old);if(!validData(parsed))throw Error('Format');data=parsed;}localStorage.setItem(KEY,JSON.stringify(data));}catch(e){storageOK=false;warn('Lokaler Speicher ist nicht verfügbar oder nicht lesbar. Bitte Trainingsdaten exportieren; sie können sonst verloren gehen.');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;warn('');$('#saveStatus').textContent='Lokal gespeichert';return true;}catch(e){storageOK=false;warn('Speichern nicht möglich. Bitte Daten exportieren, bevor du die App schließt.');$('#saveStatus').textContent='Nicht gespeichert';return false;}}
function toast(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',2400);}
const fmtDate=s=>new Date(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});const fmtNum=s=>String(s).replace('.',',');const filled=s=>s.kg.trim()!==''||s.reps.trim()!=='';const valid=s=>/^\d+(?:[.,]\d+)?$/.test(s.kg.trim())&&Number.isFinite(Number(s.kg.replace(',','.')))&&/^\d+$/.test(s.reps.trim())&&Number.isSafeInteger(Number(s.reps))&&Number(s.reps)>0;const complete=s=>s.sets.flat().filter(valid).length;
function prev(i,j){for(const s of data.history){if(valid(s.sets[i][j]))return {value:s.sets[i][j],date:s.date};}return null;}
function btn(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',fn);return b;}
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function start(){data.draft={id:globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random(),date:new Date().toISOString(),index:0,sets:empty()};save();render();}
function go(i){data.draft.index=i;save();render();window.scrollTo(0,0);}
function finish(){const d=data.draft;const n=complete(d);if(d.sets.flat().some(s=>filled(s)&&!valid(s))){toast('Bitte unvollständige oder ungültige Sätze korrigieren.');return;}if(!n){toast('Trage zuerst mindestens einen Satz ein.');return;}if(n<24&&!confirm(`Nur ${n} von 24 Sätzen eingetragen. Trotzdem abschließen?`))return;data.history.unshift({id:d.id,date:d.date,sets:d.sets});data.history.sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));data.draft=null;const ok=save();view='history';detail=data.history[0].id;render();toast(ok?'Training gespeichert':'Training im Arbeitsspeicher – bitte exportieren');window.scrollTo(0,0);}
function updateProgress(){const d=data.draft;if(!d)return;$('#count').textContent=`${complete(d)} / 24 Sätze`;$('#bar').style.width=100*complete(d)/24+'%';document.querySelectorAll('.jump button').forEach((b,i)=>b.classList.toggle('done',d.sets[i].every(valid)));}
function render(){const c=$('#content');c.replaceChildren();$('#tabTrain').setAttribute('aria-selected',view==='train');$('#tabHistory').setAttribute('aria-selected',view==='history');if(view==='history'){renderHistory(c);return;}const d=data.draft;if(!d){c.append(node('div','date',fmtDate(new Date())),node('h1','','Ganzkörpertraining'),node('p','','8 Übungen · 3 Sätze pro Übung'));const p=node('div','panel');names.forEach((n,i)=>{const r=node('div','row exercise');r.append(node('span','muted',String(i+1).padStart(2,'0')),node('span','',n));p.append(r);});c.append(p,btn('Training starten',start,'primary full'));if(data.history.length)c.append(node('p','muted',`Letztes Training: ${fmtDate(data.history[0].date)}`));return;}
const i=d.index;c.append(node('div','date',fmtDate(d.date)),node('h1','','Dein Training'));const count=node('span','muted');count.id='count';const r=node('div','row');r.append(node('span','muted',`Übung ${i+1} von 8`),count);c.append(r);const pr=node('div','progress');const bar=node('div');bar.id='bar';pr.append(bar);c.append(pr);const jmp=node('div','jump');names.forEach((n,j)=>{const b=btn(String(j+1),()=>go(j),j===i?'active':'');b.setAttribute('aria-label',n);if(i===j)b.setAttribute('aria-current','step');jmp.append(b);});c.append(jmp);const p=node('div','panel');p.append(node('h2','',names[i]));if(i===5)p.append(node('p','muted','Gewicht = Unterstützung in kg.'));const table=node('div','sets');['Satz','kg','Wdh.','Letztes Mal'].forEach(s=>table.append(node('div','label',s)));d.sets[i].forEach((s,j)=>{table.append(node('span','muted',String(j+1)));for(const k of ['kg','reps']){const input=node('input');input.type='text';input.inputMode=k==='kg'?'decimal':'numeric';input.maxLength=10;input.placeholder='–';input.autocomplete='off';input.value=s[k];input.setAttribute('aria-label',`Satz ${j+1}: ${k==='kg'?'Gewicht in Kilogramm':'Wiederholungen'}`);input.addEventListener('input',()=>{s[k]=input.value;input.classList.toggle('invalid',s[k]!==''&&!(k==='kg'?/^\d+(?:[.,]\d+)?$/.test(s[k].trim()):/^\d+$/.test(s[k].trim())&&Number(s[k])>0));save();updateProgress();});table.append(input);}const previous=prev(i,j);const pv=node('div','prev');if(previous){pv.append(node('strong','',`${fmtNum(previous.value.kg)} kg`),node('span','',`${previous.value.reps} Wdh.`));pv.title=fmtDate(previous.date);}else pv.textContent='–';table.append(pv);});p.append(table,node('div','muted','Neue Werte bleiben leer. Rechts steht der zuletzt erfasste Satz.'));c.append(p);const nav=node('div','nav');const back=btn('‹ Zurück',()=>go(i-1));back.disabled=i===0;nav.append(back,i===7?btn('Abschließen',finish,'primary'):btn('Weiter ›',()=>go(i+1),'primary'));c.append(nav);if(i!==7)c.append(btn('Training abschließen',finish,'full'));c.append(btn('Training verwerfen',()=>{if(confirm('Laufendes Training wirklich verwerfen?')){data.draft=null;save();render();}},'danger full'));updateProgress();}
function renderHistory(c){if(detail){const s=data.history.find(x=>x.id===detail);if(!s){detail=null;renderHistory(c);return;}c.append(btn('‹ Alle Trainings',()=>{detail=null;render();}),node('h1','',fmtDate(s.date)),node('p','',`${complete(s)} von 24 Sätzen erfasst`));const p=node('div','panel');names.forEach((name,i)=>{const ex=node('div','exercise');ex.append(node('h2','',name));s.sets[i].forEach((set,j)=>{const r=node('div','row');r.append(node('span','muted',`Satz ${j+1}`),node('span','',valid(set)?`${fmtNum(set.kg)} kg × ${set.reps} Wdh.`:'–'));ex.append(r);});p.append(ex);});c.append(p,btn('Training löschen',()=>{if(confirm('Dieses Training endgültig löschen?')){data.history=data.history.filter(x=>x.id!==s.id);save();detail=null;render();}},'danger full'));return;}
c.append(node('h1','','Trainingsarchiv'),node('p','',`${data.history.length} gespeicherte Trainingseinheit${data.history.length===1?'':'en'}`));if(!data.history.length)c.append(node('div','panel muted','Hier erscheinen deine abgeschlossenen Trainings.'));data.history.forEach(s=>{const b=btn('',()=>{detail=s.id;render();},'history');const r=node('div','row');r.append(node('span','',fmtDate(s.date)),node('span','muted',`${complete(s)}/24 Sätze ›`));b.append(r);c.append(b);});const p=node('div','panel');p.append(node('h2','','Datensicherung'),node('p','muted','Die Daten liegen nur in diesem Browser. Exportiere gelegentlich eine Sicherung.'));const a=node('div','actions');a.append(btn('Exportieren',exportData),btn('Importieren',()=>$('#import').click()));p.append(a);c.append(p);}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='training-log-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
$('#import').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const incoming=JSON.parse(await f.text());if(!validData(incoming))throw Error('Format');if(!confirm('Sicherung importieren? Trainings werden zusammengeführt. Ein laufendes Training bleibt erhalten.'))return;const map=new Map(incoming.history.map(s=>[s.id,s]));data.history.forEach(s=>map.set(s.id,s));data.history=[...map.values()].sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));if(!data.draft)data.draft=incoming.draft;save();render();toast('Sicherung importiert');}catch(e){toast('Ungültige Sicherungsdatei');}});
$('#tabTrain').onclick=()=>{view='train';render();};$('#tabHistory').onclick=()=>{view='history';detail=null;render();};$('#saveStatus').textContent=storageOK?'Lokaler Speicher bereit':'Nicht gespeichert';render();if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
